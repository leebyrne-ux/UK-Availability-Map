<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }
  .sidebar { width: 400px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 16px; gap: 11px; overflow-y: auto; }
  .header { display: flex; justify-content: space-between; align-items: center; }
  .header h1 { font-size: 17px; font-weight: 700; }
  .status-dot { font-size: 10px; font-weight: 700; color: #10b981; background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.4); padding: 3px 8px; border-radius: 999px; }
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 8px; text-align: center; }
  .stat-val { font-size: 19px; font-weight: 700; color: #38bdf8; }
  .stat-val.load-stat { color: #10b981; }
  .stat-lbl { font-size: 11px; color: #94a3b8; margin-top: 2px; }
  .input-box { display: flex; flex-direction: column; gap: 5px; }
  .input-box label { font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; }
  .tag-pill { font-size: 10px; padding: 2px 7px; border-radius: 999px; font-weight: 700; }
  .tag-avail { background: rgba(56,189,248,0.15); color: #38bdf8; }
  .tag-load { background: rgba(16,185,129,0.15); color: #10b981; }
  textarea { width: 100%; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 9px; font-family: monospace; font-size: 12px; line-height: 1.4; resize: vertical; }
  #avail-input { height: 140px; }
  #load-input { height: 65px; border-color: rgba(16,185,129,0.45); }
  textarea:focus { outline: none; border-color: #38bdf8; }
  .btn-row { display: flex; gap: 8px; }
  button { cursor: pointer; border: none; border-radius: 6px; padding: 8px 12px; font-size: 12px; font-weight: 600; }
  .btn-primary { background: #38bdf8; color: #0f172a; flex: 1; }
  .btn-clear { background: #263349; color: #94a3b8; border: 1px solid #334155; }
  .btn-clear:hover { color: #f8fafc; }
  .unmatched { font-size: 11px; color: #fca5a5; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); padding: 6px 9px; border-radius: 6px; display: none; }
  .section-title { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
  .hub-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex: 1; }
  .empty-state { font-size: 12px; color: #94a3b8; background: rgba(15,23,42,0.5); border: 1px dashed #334155; border-radius: 7px; padding: 14px; text-align: center; line-height: 1.45; }
  .hub-item { background: #0f172a; border: 1px solid #334155; border-radius: 7px; padding: 8px 11px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hub-item.load-card { border-left: 3px solid #10b981; }
  .hub-item.haz-card { border-left: 3px solid #ef4444; background: rgba(239,68,68,0.08); }

function project(lat, lon) {
  return { x: 448 + (lon * 66), y: 708 - ((lat - 51.5) * 96) };
}

function estimateRoadMiles(lat1, lon1, lat2, lon2) {
  var R = 3958.8;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLon = (lon2 - lon1) * Math.PI / 180;
  var s1 = Math.sin(dLat / 2);
  var s2 = Math.sin(dLon / 2);
  var a = (s1 * s1) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * (s2 * s2);
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * 1.22);
}

function isAllDigits(str) {
  if (!str || str.length === 0) return false;
  for (var i = 0; i < str.length; i++) {
    var c = str.charCodeAt(i);
    if (c < 48 || c > 57) return false;
  }
  return true;
}

function cleanToWords(str) {
  var out = "";
  for (var i = 0; i < str.length; i++) {
    var ch = str.charAt(i);
    var code = str.charCodeAt(i);
    var isLower = (code >= 97 && code <= 122);
    var isUpper = (code >= 65 && code <= 90);
    var isDigit = (code >= 48 && code <= 57);
    if (isLower || isUpper || isDigit || ch === ":") {
      out += ch.toLowerCase();
    } else {
      out += " ";
    }
  }
  var rawParts = out.split(" ");
  var words = [];
  for (var j = 0; j < rawParts.length; j++) {
    if (rawParts[j].length > 0) words.push(rawParts[j]);
  }
  return words;
}

function hasWord(paddedStr, word) {
  return paddedStr.indexOf(" " + word + " ") !== -1 || paddedStr.indexOf(" " + word + "s ") !== -1;
}

function splitLinesSafe(text) {
  var lf = String.fromCharCode(10);
  var cr = String.fromCharCode(13);
  var clean = text.split(cr).join(lf);
  return clean.split(lf);
}

function parseEntry(rawEntry, unmatchedCollector) {
  var lines = splitLinesSafe(rawEntry);
  var results = [];
  var cityKeys = Object.keys(UK_CITIES);

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;

    var tokens = cleanToWords(line);
    var padded = " " + tokens.join(" ") + " ";

    var formattedTimes = [];
    var isNight = hasWord(padded, "night") || hasWord(padded, "nights");
    var isHaz = hasWord(padded, "haz") || hasWord(padded, "hazardous") || hasWord(padded, "adr");
    var count = 1;

    for (var t = 0; t < tokens.length; t++) {
      var tok = tokens[t];
      if (tok.charAt(tok.length - 1) === "x" && isAllDigits(tok.slice(0, tok.length - 1))) {
        count = parseInt(tok.slice(0, tok.length - 1), 10);
      } else if (tok.charAt(0) === "x" && isAllDigits(tok.slice(1))) {
        count = parseInt(tok.slice(1), 10);
      } else if (tok === "x" && t > 0 && isAllDigits(tokens[t - 1])) {
        count = parseInt(tokens[t - 1], 10);
      } else if (tok === "x" && t + 1 < tokens.length && isAllDigits(tokens[t + 1])) {
        count = parseInt(tokens[t + 1], 10);
      } else if (tok.indexOf(":") !== -1 && tok.length >= 4 && tok.length <= 5) {
        formattedTimes.push(tok);
      } else if (isAllDigits(tok) && tok.length === 4) {
        formattedTimes.push(tok.slice(0, 2) + ":" + tok.slice(2));
      }
    }

    if (count === 1 && formattedTimes.length > 1) {
      count = formattedTimes.length;
    }

    var matchedKey = null;
    for (var k = 0; k < cityKeys.length; k++) {
      if (hasWord(padded, cityKeys[k])) {
        matchedKey = cityKeys[k];
        break;
      }
    }

    if (matchedKey) {
      var city = UK_CITIES[matchedKey];
      results.push({ name: city.name, lat: city.lat, lon: city.lon, region: city.region, count: count, times: formattedTimes, isNight: isNight, isHaz: isHaz });
    } else if (!isAllDigits(line)) {
      unmatchedCollector.push(line);
    }
  }
  return results;
}

function mergeItems(items) {
  var map = {};
  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    if (!map[item.name]) {
      map[item.name] = { name: item.name, lat: item.lat, lon: item.lon, region: item.region, count: item.count, times: item.times.slice(), isNight: item.isNight, isHaz: item.isHaz };
    } else {
      map[item.name].count += item.count;
      if (item.isNight) map[item.name].isNight = true;
      if (item.isHaz) map[item.name].isHaz = true;
      for (var t = 0; t < item.times.length; t++) {
        if (map[item.name].times.indexOf(item.times[t]) === -1) map[item.name].times.push(item.times[t]);
      }
    }
  }
  var out = [];
  for (var k in map) { if (map.hasOwnProperty(k)) out.push(map[k]); }
  return out;
}

function clearLoads() { document.getElementById("load-input").value = ""; updateBoard(); }
function clearAll() { document.getElementById("avail-input").value = ""; document.getElementById("load-input").value = ""; updateBoard(); }

function updateBoard() {
  var availRaw = document.getElementById("avail-input").value;
  var loadRaw = document.getElementById("load-input").value;
  var unmatched = [];
  var hubs = mergeItems(parseEntry(availRaw, unmatched));
  hubs.sort(function(a, b) { return b.count - a.count; });

  var lf = String.fromCharCode(10);
  var cr = String.fromCharCode(13);
  var normalizedLoads = loadRaw.split(cr).join(lf).split(",").join(lf);
  var loadChunks = normalizedLoads.split(lf);
  var loadParsed = [];
  for (var i = 0; i < loadChunks.length; i++) {
    var chunk = loadChunks[i].trim();
    if (chunk) loadParsed = loadParsed.concat(parseEntry(chunk, unmatched));
  }
  var loads = mergeItems(loadParsed);
  renderAll(hubs, loads, unmatched);
}

function renderAll(hubs, loads, unmatched) {
  var pinsLayer = document.getElementById("pins-layer");
  var linesLayer = document.getElementById("match-lines-layer");
  var hubListEl = document.getElementById("hub-list");
  var loadListEl = document.getElementById("load-list");
  var matchesHdr = document.getElementById("matches-header");
  var unmatchedBox = document.getElementById("unmatched-box");
  var tooltip = document.getElementById("tooltip");
  var svgNS = "http://www.w3.org/2000/svg";

  pinsLayer.innerHTML = "";
  linesLayer.innerHTML = "";
  hubListEl.innerHTML = "";
  loadListEl.innerHTML = "";

  var totalUnits = 0;
  for (var i = 0; i < hubs.length; i++) totalUnits += hubs[i].count;
  var totalLoadCount = 0;
  for (var j = 0; j < loads.length; j++) totalLoadCount += loads[j].count;

  document.getElementById("total-units").textContent = totalUnits;
  document.getElementById("total-hubs").textContent = hubs.length;
  document.getElementById("total-loads").textContent = totalLoadCount;

  if (hubs.length === 0) {
    hubListEl.innerHTML = '<div class="empty-state">No active fleet plotted.<br>Type towns in box 1 above to drop pins onto the map.</div>';
  }

  for (var hIdx = 0; hIdx < hubs.length; hIdx++) {
    (function(hub) {
      var pt = project(hub.lat, hub.lon);
      var radius = Math.min(22, 10 + hub.count * 2.2);
      var color = hub.isNight ? "#a855f7" : (hub.times.length > 0 ? "#f59e0b" : "#38bdf8");

      var g = document.createElementNS(svgNS, "g");
      g.setAttribute("class", "pin-group");

      var ring = document.createElementNS(svgNS, "circle");
      ring.setAttribute("cx", pt.x); ring.setAttribute("cy", pt.y); ring.setAttribute("r", radius + 4); ring.setAttribute("fill", color); ring.setAttribute("opacity", "0.22");
      g.appendChild(ring);

      var circle = document.createElementNS(svgNS, "circle");
      circle.setAttribute("cx", pt.x); circle.setAttribute("cy", pt.y); circle.setAttribute("r", radius); circle.setAttribute("fill", color); circle.setAttribute("stroke", "#0f172a"); circle.setAttribute("stroke-width", "2");
      g.appendChild(circle);

      var countTxt = document.createElementNS(svgNS, "text");
      countTxt.setAttribute("x", pt.x); countTxt.setAttribute("y", pt.y); countTxt.setAttribute("class", "pin-count"); countTxt.textContent = hub.count;
      g.appendChild(countTxt);

      var label = document.createElementNS(svgNS, "text");
      label.setAttribute("x", pt.x + radius + 5); label.setAttribute("y", pt.y + 4); label.setAttribute("class", "pin-label");
      var timeTag = hub.times.length ? " (" + hub.times.join(", ") + ")" : (hub.isNight ? " (Night)" : "");
      label.textContent = hub.name + timeTag;
      g.appendChild(label);

      g.onmousemove = function(e) {
        tooltip.style.display = "block";
        tooltip.style.borderColor = color;
        tooltip.style.left = (e.offsetX + 18) + "px";
        tooltip.style.top = (e.offsetY - 10) + "px";
        tooltip.innerHTML = '<strong style="color:' + color + ';">' + hub.name + ' &mdash; ' + hub.count + ' Available</strong><div style="color:#94a3b8;">' + hub.region + '</div>';
      };
      g.onmouseleave = function() { tooltip.style.display = "none"; };
      pinsLayer.appendChild(g);

      var item = document.createElement("div");
      item.className = "hub-item";
      var badgeClass = hub.isNight ? "badge night" : (hub.times.length ? "badge timed" : "badge");
      var subNote = hub.times.length ? "Waves: " + hub.times.join(", ") : (hub.isNight ? "Night drivers" : hub.region);
      item.innerHTML = '<div><div class="hub-name">' + hub.name + '</div><div class="hub-meta">' + subNote + '</div></div><span class="' + badgeClass + '">' + hub.count + 'x</span>';
      hubListEl.appendChild(item);
    })(hubs[hIdx]);
  }

  if (loads.length > 0) {
    matchesHdr.style.display = "block";
    for (var lIdx = 0; lIdx < loads.length; lIdx++) {
      (function(load) {
        var lPt = project(load.lat, load.lon);
        var pinColor = load.isHaz ? "#ef4444" : "#10b981";
        var strokeColor = load.isHaz ? "#fbbf24" : "#ffffff";

        var rankedHubs = [];
        for (var r = 0; r < hubs.length; r++) {
          rankedHubs.push({ name: hubs[r].name, count: hubs[r].count, lat: hubs[r].lat, lon: hubs[r].lon, miles: estimateRoadMiles(load.lat, load.lon, hubs[r].lat, hubs[r].lon) });
        }
        rankedHubs.sort(function(a, b) { return a.miles - b.miles; });
        rankedHubs = rankedHubs.slice(0, 3);

        for (var m = 0; m < rankedHubs.length; m++) {
          var match = rankedHubs[m];
          var hPt = project(match.lat, match.lon);
          var line = document.createElementNS(svgNS, "line");
          line.setAttribute("x1", lPt.x); line.setAttribute("y1", lPt.y); line.setAttribute("x2", hPt.x); line.setAttribute("y2", hPt.y);
          line.setAttribute("stroke", pinColor); line.setAttribute("stroke-width", m === 0 ? "2.4" : "1.3"); line.setAttribute("stroke-dasharray", m === 0 ? "5 4" : "2 5"); line.setAttribute("opacity", m === 0 ? "0.9" : "0.45");
          linesLayer.appendChild(line);
        }

        var g = document.createElementNS(svgNS, "g");
        g.setAttribute("class", "pin-group");
        var size = load.isHaz ? 16 : 14;
        var diamond = document.createElementNS(svgNS, "polygon");
        diamond.setAttribute("points", lPt.x + "," + (lPt.y - size) + " " + (lPt.x + size) + "," + lPt.y + " " + lPt.x + "," + (lPt.y + size) + " " + (lPt.x - size) + "," + lPt.y);
        diamond.setAttribute("fill", pinColor); diamond.setAttribute("stroke", strokeColor); diamond.setAttribute("stroke-width", "2.2");
        g.appendChild(diamond);

        var loadCountTxt = document.createElementNS(svgNS, "text");
        loadCountTxt.setAttribute("x", lPt.x); loadCountTxt.setAttribute("y", lPt.y); loadCountTxt.setAttribute("class", "pin-count");
        if (load.isHaz) loadCountTxt.setAttribute("fill", "#ffffff");
        loadCountTxt.textContent = load.count;
        g.appendChild(loadCountTxt);

        var label = document.createElementNS(svgNS, "text");
        label.setAttribute("x", lPt.x + 19); label.setAttribute("y", lPt.y + 4);
        label.setAttribute("class", load.isHaz ? "pin-label haz-lbl" : "pin-label load-lbl");
        label.textContent = load.isHaz ? ("HAZ: " + load.name) : ("LOAD: " + load.name);
        g.appendChild(label);

        pinsLayer.appendChild(g);

        var card = document.createElement("div");
        card.className = load.isHaz ? "hub-item load-card haz-card" : "hub-item load-card";
        var shortArr = [];
        for (var q = 0; q < rankedHubs.length; q++) shortArr.push(rankedHubs[q].name + " (~" + rankedHubs[q].miles + "m)");
        var matchText = shortArr.length ? "Nearest: " + shortArr.join(" | ") : "No fleet available";
        var hazBadge = load.isHaz ? '<span class="badge haz">&#9763; HAZ / ADR</span>' : '';
        var titleColor = load.isHaz ? "#fca5a5" : "#6ee7b7";
        card.innerHTML = '<div><div class="hub-name" style="color:' + titleColor + ';">' + load.name + hazBadge + '</div><div class="match-line">' + matchText + '</div></div><span class="badge load">' + load.count + 'x</span>';
        loadListEl.appendChild(card);
      })(loads[lIdx]);
    }
  } else {
    matchesHdr.style.display = "none";
  }

  if (unmatched.length > 0) {
    unmatchedBox.style.display = "block";
    unmatchedBox.textContent = "Unrecognized towns: " + unmatched.join(", ");
  } else {
    unmatchedBox.style.display = "none";
  }
}

updateBoard();
</script>
</body>
</html>
