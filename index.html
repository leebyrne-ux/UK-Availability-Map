<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK Transport Availability & Load Matcher</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-alt: #263349;
    --border: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --timed: #f59e0b;
    --night: #a855f7;
    --load: #10b981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  .sidebar {
    width: 410px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 12px;
    overflow-y: auto;
  }
  .header h1 { font-size: 17px; font-weight: 700; }
  .header p { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .stat-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    text-align: center;
  }
  .stat-val { font-size: 19px; font-weight: 700; color: var(--accent); }
  .stat-val.load-stat { color: var(--load); }
  .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .input-box { display: flex; flex-direction: column; gap: 5px; }
  .input-box label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .tag-pill {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 999px;
    font-weight: 700;
  }
  .tag-avail { background: rgba(56, 189, 248, 0.15); color: var(--accent); }
  .tag-load  { background: rgba(16, 185, 129, 0.15); color: var(--load); }

  textarea {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    line-height: 1.4;
    resize: vertical;
  }
  textarea#avail-input { height: 145px; }
  textarea#load-input  { height: 68px; border-color: rgba(16, 185, 129, 0.45); }
  textarea:focus { outline: none; border-color: var(--accent); }
  textarea#load-input:focus { border-color: var(--load); }

  .btn-row { display: flex; gap: 8px; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 600;
    transition: 0.15s;
  }
  .btn-primary { background: var(--accent); color: #0f172a; flex: 1; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-clear { background: var(--panel-alt); color: var(--muted); border: 1px solid var(--border); }
  .btn-clear:hover { color: var(--text); border-color: var(--muted); }

  .unmatched {
    font-size: 11px;
    color: #fca5a5;
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.3);
    padding: 6px 9px;
    border-radius: 6px;
    display: none;
  }

  .section-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 2px;
  }
  .hub-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
    flex: 1;
    padding-right: 2px;
  }
  .hub-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 11px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: 0.15s;
  }
  .hub-item:hover { border-color: var(--accent); background: #162238; }
  .hub-item.load-card { border-left: 3px solid var(--load); }
  .hub-item.load-card:hover { border-color: var(--load); }
  .hub-name { font-size: 13px; font-weight: 600; }
  .hub-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .match-line { font-size: 11px; color: #6ee7b7; margin-top: 3px; font-weight: 500; }

  .badge {
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent);
    border: 1px solid rgba(56, 189, 248, 0.4);
    font-weight: 700;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.timed { background: rgba(245, 158, 11, 0.15); color: var(--timed); border-color: rgba(245, 158, 11, 0.4); }
  .badge.night { background: rgba(168, 85, 247, 0.15); color: #d8b4fe; border-color: rgba(168, 85, 247, 0.4); }
  .badge.load  { background: rgba(16, 185, 129, 0.15); color: var(--load); border-color: rgba(16, 185, 129, 0.4); }

  /* Map Area */
  .map-wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #131f38 0%, #0b1120 100%);
    overflow: hidden;
  }
  svg#uk-map { width: 100%; height: 100%; max-width: 900px; max-height: 96vh; }
  .legend {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(30, 41, 59, 0.92);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .legend-row { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .diamond-icon {
    width: 10px; height: 10px; background: var(--load);
    transform: rotate(45deg); display: inline-block;
  }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(15, 23, 42, 0.96);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 10px 13px;
    font-size: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    display: none;
    z-index: 20;
    min-width: 180px;
  }
  .pin-group { cursor: pointer; }
  .pin-label {
    font-size: 11px;
    font-weight: 600;
    fill: #f8fafc;
    paint-order: stroke;
    stroke: #0f172a;
    stroke-width: 3px;
    stroke-linejoin: round;
  }
  .pin-label.load-lbl { fill: #6ee7b7; font-weight: 700; }
  .pin-count {
    font-size: 11px;
    font-weight: 800;
    fill: #0f172a;
    text-anchor: middle;
    dominant-baseline: central;
  }
</style>
</head>

function safeStorageGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}

function safeStorageSet(key, val) {
  try { localStorage.setItem(key, val); } catch (e) { /* ignore if sandboxed */ }
}

function project(lat, lon) {
  return {
    x: 448 + (lon * 66),
    y: 708 - ((lat - 51.5) * 96)
  };
}

function estimateRoadMiles(lat1, lon1, lat2, lon2) {
  const R = 3958.8;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const straight = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return Math.round(straight * 1.22);
}

function parseEntry(rawEntry, unmatchedCollector) {
  const normalized = rawEntry.replace(/([a-z])([A-Z])/g, "$1\n$2");
  const lines = normalized.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const results = [];

  lines.forEach(line => {
    const lower = line.toLowerCase();
    const timeMatches = line.match(/\b([01]?\d|2[0-3]):?[0-5]\d\b/g) || [];
    const formattedTimes = timeMatches.map(t => t.includes(":") ? t : t.slice(0, 2) + ":" + t.slice(2));
    const isNight = /night/i.test(line);

    let count = 1;
    const prefixMult = lower.match(/^(\d+)\s*x\b/);
    const suffixMult = lower.match(/\bx\s*(\d+)\b/);
    if (prefixMult) count = parseInt(prefixMult[1], 10);
    else if (suffixMult) count = parseInt(suffixMult[1], 10);
    else if (formattedTimes.length > 1) count = formattedTimes.length;

    let matchedKey = null;
    for (const key of Object.keys(UK_CITIES)) {
      const regex = new RegExp(`\\b${key}s?\\b`, "i");
      if (regex.test(lower)) {
        matchedKey = key;
        break;
      }
    }

    if (matchedKey) {
      const city = UK_CITIES[matchedKey];
      results.push({
        ...city,
        count: count,
        times: formattedTimes,
        isNight: isNight
      });
    } else if (!/^\d{3,4}$/.test(line)) {
      unmatchedCollector.push(line);
    }
  });

  return results;
}

function mergeItems(items) {
  const map = {};
  items.forEach(item => {
    if (!map[item.name]) {
      map[item.name] = { ...item, times: [...item.times] };
    } else {
      map[item.name].count += item.count;
      if (item.isNight) map[item.name].isNight = true;
      item.times.forEach(t => {
        if (!map[item.name].times.includes(t)) map[item.name].times.push(t);
      });
    }
  });
  return Object.values(map);
}

function updateBoard() {
  const availEl = document.getElementById("avail-input");
  const loadEl  = document.getElementById("load-input");
  if (!availEl || !loadEl) return;

  const availRaw = availEl.value;
  const loadRaw  = loadEl.value;

  safeStorageSet("uk_transport_avail", availRaw);
  safeStorageSet("uk_transport_loads", loadRaw);

  const unmatched = [];

  // Parse availability line-by-line (keeps "Amesbury 0700, 1000, 1400" together)
  const availParsed = parseEntry(availRaw, unmatched);
  const hubs = mergeItems(availParsed).sort((a, b) => b.count - a.count);

  // Parse offered loads (supports both new lines and comma-separated towns)
  const loadChunks = loadRaw.split(/[\r\n,]+/).map(s => s.trim()).filter(Boolean);
  let loadParsed = [];
  loadChunks.forEach(chunk => {
    loadParsed = loadParsed.concat(parseEntry(chunk, unmatched));
  });
  const loads = mergeItems(loadParsed);

  renderAll(hubs, loads, unmatched);
}

function renderAll(hubs, loads, unmatched) {
  const pinsLayer    = document.getElementById("pins-layer");
  const linesLayer   = document.getElementById("match-lines-layer");
  const hubListEl    = document.getElementById("hub-list");
  const loadListEl   = document.getElementById("load-list");
  const matchesHdr   = document.getElementById("matches-header");
  const unmatchedBox = document.getElementById("unmatched-box");
  const tooltip      = document.getElementById("tooltip");

  pinsLayer.innerHTML = "";
  linesLayer.innerHTML = "";
  hubListEl.innerHTML = "";
  loadListEl.innerHTML = "";

  let totalUnits = 0;
  hubs.forEach(h => totalUnits += h.count);

  let totalLoadCount = 0;
  loads.forEach(l => totalLoadCount += l.count);

  document.getElementById("total-units").textContent = totalUnits;
  document.getElementById("total-hubs").textContent  = hubs.length;
  document.getElementById("total-loads").textContent = totalLoadCount;

  // 1. Plot Fleet Availability Hubs
  hubs.forEach(hub => {
    const pt = project(hub.lat, hub.lon);
    const radius = Math.min(22, 10 + hub.count * 2.2);
    const color = hub.isNight ? "#a855f7" : (hub.times.length > 0 ? "#f59e0b" : "#38bdf8");

    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "pin-group");

    const ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    ring.setAttribute("cx", pt.x); ring.setAttribute("cy", pt.y);
    ring.setAttribute("r", radius + 4); ring.setAttribute("fill", color);
    ring.setAttribute("opacity", "0.22");
    g.appendChild(ring);

    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("cx", pt.x); circle.setAttribute("cy", pt.y);
    circle.setAttribute("r", radius); circle.setAttribute("fill", color);
    circle.setAttribute("stroke", "#0f172a"); circle.setAttribute("stroke-width", "2");
    g.appendChild(circle);

    const countTxt = document.createElementNS("http://www.w3.org/2000/svg", "text");
    countTxt.setAttribute("x", pt.x); countTxt.setAttribute("y", pt.y);
    countTxt.setAttribute("class", "pin-count");
    countTxt.textContent = hub.count;
    g.appendChild(countTxt);

    const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
    label.setAttribute("x", pt.x + radius + 5); label.setAttribute("y", pt.y + 4);
    label.setAttribute("class", "pin-label");
    const timeTag = hub.times.length ? ` (${hub.times.join(", ")})` : (hub.isNight ? " (Night)" : "");
    label.textContent = `${hub.name}${timeTag}`;
    g.appendChild(label);

    g.addEventListener("mousemove", (e) => {
      tooltip.style.display = "block";
      tooltip.style.borderColor = color;
      tooltip.style.left = (e.offsetX + 18) + "px";
      tooltip.style.top = (e.offsetY - 10) + "px";
      tooltip.innerHTML = `
        <strong style="color:${color};">${hub.name} &mdash; ${hub.count} Available</strong>
        <div style="color:#94a3b8;">${hub.region}</div>
        ${hub.times.length ? `<div style="color:#fbbf24; margin-top:3px;">Waves: ${hub.times.join(", ")}</div>` : ""}
        ${hub.isNight ? `<div style="color:#d8b4fe; margin-top:3px;">Night Drivers</div>` : ""}
      `;
    });
    g.addEventListener("mouseleave", () => tooltip.style.display = "none");
    pinsLayer.appendChild(g);

    // Sidebar Hub Card
    const item = document.createElement("div");
    item.className = "hub-item";
    const badgeClass = hub.isNight ? "badge night" : (hub.times.length ? "badge timed" : "badge");
    const subNote = hub.times.length ? `Waves: ${hub.times.join(", ")}` : (hub.isNight ? "Night drivers" : hub.region);
    item.innerHTML = `
      <div>
        <div class="hub-name">${hub.name}</div>
        <div class="hub-meta">${subNote}</div>
      </div>
      <span class="${badgeClass}">${hub.count}x</span>
    `;
    item.addEventListener("mouseenter", () => { circle.setAttribute("stroke", "#fff"); circle.setAttribute("stroke-width", "3.5"); });
    item.addEventListener("mouseleave", () => { circle.setAttribute("stroke", "#0f172a"); circle.setAttribute("stroke-width", "2"); });
    hubListEl.appendChild(item);
  });

  // 2. Plot Potential Load Offers (Green Diamonds) & Nearest Fleet Match Lines
  if (loads.length > 0) {
    matchesHdr.style.display = "block";
    loads.forEach(load => {
      const lPt = project(load.lat, load.lon);

      const rankedHubs = hubs.map(h => ({
        ...h,
        miles: estimateRoadMiles(load.lat, load.lon, h.lat, h.lon)
      })).sort((a, b) => a.miles - b.miles).slice(0, 3);

      rankedHubs.forEach((match, i) => {
        const hPt = project(match.lat, match.lon);
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", lPt.x); line.setAttribute("y1", lPt.y);
        line.setAttribute("x2", hPt.x); line.setAttribute("y2", hPt.y);
        line.setAttribute("stroke", "#10b981");
        line.setAttribute("stroke-width", i === 0 ? "2.4" : "1.3");
        line.setAttribute("stroke-dasharray", i === 0 ? "5 4" : "2 5");
        line.setAttribute("opacity", i === 0 ? "0.9" : "0.45");
        linesLayer.appendChild(line);
      });

      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("class", "pin-group");

      const size = 14;
      const diamond = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
      diamond.setAttribute("points", `${lPt.x},${lPt.y - size} ${lPt.x + size},${lPt.y} ${lPt.x},${lPt.y + size} ${lPt.x - size},${lPt.y}`);
      diamond.setAttribute("fill", "#10b981");
      diamond.setAttribute("stroke", "#ffffff");
      diamond.setAttribute("stroke-width", "2");
      g.appendChild(diamond);

      const loadCountTxt = document.createElementNS("http://www.w3.org/2000/svg", "text");
      loadCountTxt.setAttribute("x", lPt.x); loadCountTxt.setAttribute("y", lPt.y);
      loadCountTxt.setAttribute("class", "pin-count");
      loadCountTxt.textContent = load.count;
      g.appendChild(loadCountTxt);

      const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
      label.setAttribute("x", lPt.x + 17); label.setAttribute("y", lPt.y + 4);
      label.setAttribute("class", "pin-label load-lbl");
      label.textContent = `LOAD: ${load.name}`;
      g.appendChild(label);

      const nearestSummary = rankedHubs.length
        ? rankedHubs.map(m => `${m.name} (${m.count}x, ~${m.miles} mi)`).join("<br>")
        : "No available fleet entered";

      g.addEventListener("mousemove", (e) => {
        tooltip.style.display = "block";
        tooltip.style.borderColor = "#10b981";
        tooltip.style.left = (e.offsetX + 18) + "px";
        tooltip.style.top = (e.offsetY - 10) + "px";
        tooltip.innerHTML = `
          <strong style="color:#10b981;">OFFERED LOAD: ${load.name} (${load.count}x)</strong>
          <div style="color:#94a3b8; margin-bottom:5px;">${load.region}</div>
          <div style="font-size:11px; color:#f8fafc;"><strong>Nearest Fleet Matches:</strong><br>${nearestSummary}</div>
        `;
      });
      g.addEventListener("mouseleave", () => tooltip.style.display = "none");
      pinsLayer.appendChild(g);

      const card = document.createElement("div");
      card.className = "hub-item load-card";
      const matchText = rankedHubs.length
        ? "Nearest: " + rankedHubs.map(m => `${m.name} (~${m.miles}m)`).join(" • ")
        : "No fleet available";
      card.innerHTML = `
        <div>
          <div class="hub-name" style="color:#6ee7b7;">${load.name} (Load Offer)</div>
          <div class="match-line">${matchText}</div>
        </div>
        <span class="badge load">${load.count}x</span>
      `;
      loadListEl.appendChild(card);
    });
  } else {
    matchesHdr.style.display = "none";
  }

  if (unmatched.length > 0) {
    unmatchedBox.style.display = "block";
    unmatchedBox.textContent = "Unrecognized towns: " + unmatched.join(", ");
  } else {
    unmatchedBox.style.display = "none";
  }
}

// Wire up events cleanly
(function init() {
  const availInput = document.getElementById("avail-input");
  const loadInput  = document.getElementById("load-input");

  const savedAvail = safeStorageGet("uk_transport_avail");
  const savedLoads = safeStorageGet("uk_transport_loads");

  availInput.value = savedAvail !== null ? savedAvail : DEFAULT_AVAIL;
  if (savedLoads !== null) loadInput.value = savedLoads;

  // Live update as you type or paste
  availInput.addEventListener("input", updateBoard);
  loadInput.addEventListener("input", updateBoard);

  document.getElementById("btn-update").addEventListener("click", updateBoard);
  document.getElementById("btn-clear-loads").addEventListener("click", () => {
    loadInput.value = "";
    updateBoard();
  });
  document.getElementById("btn-reset").addEventListener("click", () => {
    availInput.value = DEFAULT_AVAIL;
    loadInput.value = "Northampton";
    updateBoard();
  });

  updateBoard();
})();
</script>
