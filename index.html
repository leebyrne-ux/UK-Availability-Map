<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK Transport Availability & Load Matcher</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-alt: #263349;
    --border: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --timed: #f59e0b;
    --night: #a855f7;
    --load: #10b981;
    --haz: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  .sidebar {
    width: 410px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 12px;
    overflow-y: auto;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .header h1 { font-size: 17px; font-weight: 700; }
  .header p { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .status-dot {
    font-size: 10px;
    font-weight: 700;
    color: #10b981;
    background: rgba(16, 185, 129, 0.12);
    border: 1px solid rgba(16, 185, 129, 0.35);
    padding: 3px 8px;
    border-radius: 999px;
    transition: transform 0.15s;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .stat-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    text-align: center;
  }
  .stat-val { font-size: 19px; font-weight: 700; color: var(--accent); }
  .stat-val.load-stat { color: var(--load); }
  .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .input-box { display: flex; flex-direction: column; gap: 5px; }
  .input-box label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .tag-pill {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 999px;
    font-weight: 700;
  }
  .tag-avail { background: rgba(56, 189, 248, 0.15); color: var(--accent); }
  .tag-load  { background: rgba(16, 185, 129, 0.15); color: var(--load); }

  textarea {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    line-height: 1.4;
    resize: vertical;
  }
  textarea#avail-input { height: 145px; }
  textarea#load-input  { height: 68px; border-color: rgba(16, 185, 129, 0.45); }
  textarea:focus { outline: none; border-color: var(--accent); }
  textarea#load-input:focus { border-color: var(--load); }

  .btn-row { display: flex; gap: 8px; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 600;
    transition: 0.15s;
  }
  .btn-primary { background: var(--accent); color: #0f172a; flex: 1; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-clear { background: var(--panel-alt); color: var(--muted); border: 1px solid var(--border); }
  .btn-clear:hover { color: var(--text); border-color: var(--muted); }

  .unmatched {
    font-size: 11px;
    color: #fca5a5;
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.3);
    padding: 6px 9px;
    border-radius: 6px;
    display: none;
  }

  .section-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 2px;
  }
  .hub-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
    flex: 1;
    padding-right: 2px;
  }
  .empty-state {
    font-size: 12px;
    color: var(--muted);
    background: rgba(15, 23, 42, 0.5);
    border: 1px dashed var(--border);
    border-radius: 7px;
    padding: 14px 12px;
    text-align: center;
    line-height: 1.45;
  }
  .hub-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 11px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: 0.15s;
    gap: 8px;
  }
  .hub-item:hover { border-color: var(--accent); background: #162238; }
  .hub-item.load-card { border-left: 3px solid var(--load); }
  .hub-item.load-card:hover { border-color: var(--load); }
  .hub-item.haz-card { border-left: 3px solid var(--haz); background: rgba(239, 68, 68, 0.06); }
  .hub-item.haz-card:hover { border-color: var(--haz); }
  .hub-name { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .hub-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .match-line { font-size: 11px; color: #6ee7b7; margin-top: 3px; font-weight: 500; }

  .badge {
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent);
    border: 1px solid rgba(56, 189, 248, 0.4);
    font-weight: 700;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.timed { background: rgba(245, 158, 11, 0.15); color: var(--timed); border-color: rgba(245, 158, 11, 0.4); }
  .badge.night { background: rgba(168, 85, 247, 0.15); color: #d8b4fe; border-color: rgba(168, 85, 247, 0.4); }
