<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK Transport Availability & Load Matcher (Shared)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }
  .sidebar { width: 400px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 15px; gap: 10px; overflow-y: auto; }
  .header { display: flex; justify-content: space-between; align-items: center; }
  .header h1 { font-size: 16px; font-weight: 700; }
  .pill { font-size: 10px; font-weight: 700; color: #10b981; background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.4); padding: 3px 8px; border-radius: 99px; }
  .pill.busy { color: #fbbf24; border-color: #f59e0b; background: rgba(245,158,11,0.15); }
  .pill.err { color: #fca5a5; border-color: #ef4444; background: rgba(239,68,68,0.15); }
  .sync-bar { font-size: 11px; color: #94a3b8; background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: #0f172a; border: 1px solid #334155; border-radius: 7px; padding: 7px; text-align: center; }
  .stat b { font-size: 18px; color: #38bdf8; display: block; }
  .stat.g b { color: #10b981; }
  .stat span { font-size: 11px; color: #94a3b8; }
  label { font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; margin-bottom: 4px; }
  textarea { width: 100%; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 7px; padding: 8px; font-family: monospace; font-size: 12px; resize: vertical; }
  #avail { height: 130px; }
  #loads { height: 65px; border-color: rgba(16,185,129,0.45); }
  textarea:focus { outline: none; border-color: #38bdf8; }
  .btns { display: flex; gap: 7px; }
  button { cursor: pointer; border: none; border-radius: 6px; padding: 8px 11px; font-size: 12px; font-weight: 600; }
  .btn-main { background: #38bdf8; color: #0f172a; flex: 1; }
  .btn-sub { background: #263349; color: #94a3b8; border: 1px solid #334155; }
  .btn-sub:hover { color: #fff; }
  .msg { font-size: 11px; padding: 6px 9px; border-radius: 6px; display: none; background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); }
  .sec { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
  .list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex: 1; }
  .card { background: #0f172a; border: 1px solid #334155; border-radius: 7px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card.ld { border-left: 3px solid #10b981; }
  .card.hz { border-left: 3px solid #ef4444; background: rgba(239,68,68,0.08); }
  .card-title { font-size: 13px; font-weight: 600; }
  .card-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }
  .tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: rgba(56,189,248,0.15); color: #38bdf8; border: 1px solid rgba(56,189,248,0.4); white-space: nowrap; }
  .tag.t { color: #f59e0b; background: rgba(245,158,11,0.15); border-color: rgba(245,158,11,0.4); }
  .tag.n { color: #d8b4fe; background: rgba(168,85,247,0.15); border-color: rgba(168,85,247,0.4); }
  .tag.g { color: #10b981; background: rgba(16,185,129,0.15); border-color: rgba(16,185,129,0.4); }
  .tag.h { color: #fca5a5; background: rgba(239,68,68,0.25); border-color: rgba(239,68,68,0.6); font-size: 10px; padding: 1px 5px; margin-left: 4px; }
  .map { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; background: #0b1120; }
  svg { width: 100%; height: 100%; max-width: 880px; max-height: 96vh; }
  .legend { position: absolute; top: 15px; right: 15px; background: rgba(30,41,59,0.92); border: 1px solid #334155; border-radius: 8px; padding: 10px 13px; font-size: 11px; display: flex; flex-direction: column; gap: 6px; color: #94a3b8; }
  .row { display: flex; align-items: center; gap: 7px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dia { width: 9px; height: 9px; background: #10b981; transform: rotate(45deg); display: inline-block; }
  .dia.hz { background: #ef4444; border: 1px solid #fbbf24; }
  .lbl { font-size: 11px; font-weight: 600; fill: #f8fafc; paint-order: stroke; stroke: #0f172a; stroke-width: 3px; }
  .lbl.g { fill: #6ee7b7; }
  .lbl.h { fill: #fca5a5; font-weight: 800; }
  .cnt { font-size: 11px; font-weight: 800; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="header"><h1>UK Transport Board</h1><span class="pill" id="status">v11.0 SHARED</span></div>
  <div class="sync-bar"><span id="sync-info">Connecting to crew board...</span><span id="last-time">--:--</span></div>
  <div class="stats">
    <div class="stat"><b id="s-units">0</b><span>Available</span></div>
    <div class="stat"><b id="s-hubs">0</b><span>Hubs</span></div>
    <div class="stat g"><b id="s-loads">0</b><span>Offers</span></div>
  </div>
  <div>
    <label><span>1. Crew Fleet Availability</span><span style="color:#38bdf8;font-size:11px;">Shared Live</span></label>
    <textarea id="avail" oninput="onUserEdit()" placeholder="e.g. Wolverhampton x 3&#10;Amesbury 0700, 1000, 1400"></textarea>
  </div>
  <div>
    <label><span>2. Potential Load Offers</span><span style="color:#10b981;font-size:11px;">Supports "Haz" / Postcodes</span></label>
    <textarea id="loads" oninput="onUserEdit()" placeholder="e.g. Northampton Haz, NN4 7YB"></textarea>
  </div>
  <div class="btns">
    <button type="button" class="btn-main" onclick="pushToCloud()">Sync Now</button>
    <button type="button" class="btn-sub" onclick="document.getElementById('loads').value='';onUserEdit()">Clear Loads</button>
    <button type="button" class="btn-sub" onclick="document.getElementById('avail').value='';document.getElementById('loads').value='';onUserEdit()">Clear All</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="sec" id="hdr-loads" style="display:none;color:#6ee7b7;">Offered Loads &amp; Nearest Fleet</div>
  <div id="list-loads" style="display:flex;flex-direction:column;gap:6px;"></div>
  <div class="sec">Available Fleet Hubs</div>
  <div class="list" id="list-hubs"></div>
</div>

<div class="map">
  <div class="legend">
    <b style="color:#f8fafc;">Map Key</b>
    <div class="row"><span class="dot" style="background:#38bdf8;"></span> Available Fleet</div>
    <div class="row"><span class="dot" style="background:#f59e0b;"></span> Timed Wave</div>
    <div class="row"><span class="dot" style="background:#a855f7;"></span> Night Drivers</div>
    <div class="row"><span class="dia"></span> Standard Load</div>
    <div class="row"><span class="dia hz"></span> &#9763; Hazardous / ADR</div>
  </div>
  <svg viewBox="0 0 620 860">
    <g fill="#1e293b" stroke="#475569" stroke-width="2" stroke-linejoin="round">
      <path d="M 155,795 L 185,782 L 222,775 L 258,765 L 298,763 L 348,763 L 392,756 L 445,754 L 495,745 L 522,732 L 502,718 L 478,712 L 508,695 L 525,668 L 538,632 L 535,602 L 502,592 L 475,596 L 468,615 L 455,605 L 452,572 L 432,535 L 420,515 L 435,512 L 415,482 L 392,455 L 372,422 L 352,388 L 335,360 L 315,342 L 292,332 L 318,318 L 325,292 L 302,282 L 328,255 L 345,215 L 342,185 L 295,182 L 278,195 L 272,165 L 285,132 L 282,102 L 242,105 L 208,112 L 202,148 L 195,188 L 182,225 L 195,255 L 188,288 L 215,305 L 205,335 L 235,348 L 265,352 L 278,378 L 262,402 L 282,428 L 292,462 L 278,495 L 288,522 L 265,535 L 228,538 L 205,548 L 225,568 L 215,598 L 182,625 L 178,648 L 212,658 L 252,662 L 278,668 L 262,688 L 222,708 L 188,735 L 152,768 Z"/>
      <path d="M 358,770 L 374,768 L 378,776 L 362,779 Z"/>
      <path d="M 206,530 L 222,526 L 225,538 L 208,540 Z"/>
    </g>
    <g fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round">
      <path d="M 442,705 L 415,650 L 385,602 L 368,555 L 352,495 M 385,602 L 335,585 L 322,542 L 315,495 L 298,415 M 442,705 L 395,708 L 315,695 L 265,672 M 442,705 L 440,680 L 428,605 L 395,515 L 362,422 L 348,378 M 335,585 L 308,655 L 262,735"/>
    </g>
    <g id="lines"></g>
    <g id="pins"></g>
  </svg>
</div>

<script>
// PASTE YOUR FIREBASE REALTIME DATABASE URL BELOW:
var DB_URL = "PASTE_YOUR_FIREBASE_URL_HERE";

// Strip any trailing slashes automatically so /board.json never becomes //board.json
while (DB_URL.length > 0 && DB_URL.charAt(DB_URL.length - 1) === "/") {
  DB_URL = DB_URL.slice(0, -1);
}

var HUBS = {
  "wolverhampton":["Wolverhampton",52.5862,-2.1288,"West Midlands"], "amesbury":["Amesbury",51.1743,-1.7805,"South West"],
  "deeside":["Deeside",53.2045,-3.0338,"North Wales / NW"], "darlington":["Darlington",54.5236,-1.5594,"North East"],
  "hatfield":["Hatfield",51.7634,-0.2258,"Home Counties"], "peterborough":["Peterborough",52.5695,-0.2405,"East"],
  "stockport":["Stockport",53.4106,-2.1575,"North West"], "birkenhead":["Birkenhead",53.3934,-3.0148,"Merseyside"],
  "leicester":["Leicester",52.6369,-1.1398,"East Midlands"], "midlands":["Midlands Hub",52.4862,-1.8904,"Midlands"],
  "mildlands":["Midlands Hub",52.4862,-1.8904,"Midlands"], "birmingham":["Birmingham",52.4862,-1.8904,"West Midlands"],
  "rugby":["Rugby",52.3709,-1.2650,"Golden Triangle"], "stoke":["Stoke-on-Trent",53.0027,-2.1794,"North Midlands"],
  "reading":["Reading",51.4543,-0.9781,"Thames Valley"], "northampton":["Northampton",52.2405,-0.9027,"Midlands"],
  "london":["London",51.5074,-0.1278,"Greater London"], "manchester":["Manchester",53.4808,-2.2426,"North West"],
  "leeds":["Leeds",53.8008,-1.5491,"Yorkshire"], "sheffield":["Sheffield",53.3811,-1.4701,"South Yorkshire"],
  "nottingham":["Nottingham",52.9548,-1.1581,"East Midlands"], "derby":["Derby",52.9225,-1.4746,"East Midlands"],
  "coventry":["Coventry",52.4068,-1.5197,"West Midlands"], "milton keynes":["Milton Keynes",52.0406,-0.7594,"South Midlands"],
  "bristol":["Bristol",51.4545,-2.5879,"South West"], "swindon":["Swindon",51.5558,-1.7797,"South West"],
  "southampton":["Southampton",50.9097,-1.4044,"South Coast"], "cardiff":["Cardiff",51.4816,-3.1791,"South Wales"],
  "liverpool":["Liverpool",53.4084,-2.9916,"Merseyside"], "warrington":["Warrington",53.3900,-2.5970,"North West"],
  "newcastle":["Newcastle",54.9783,-1.6178,"North East"], "hull":["Hull",53.7676,-0.3274,"East Yorkshire"],
  "doncaster":["Doncaster",53.5228,-1.1285,"South Yorkshire"], "norwich":["Norwich",52.6309,1.2974,"East Anglia"],
  "felixstowe":["Felixstowe",51.9617,1.3513,"Suffolk Port"], "cambridge":["Cambridge",52.2053,0.1218,"East"],
  "oxford":["Oxford",51.7520,-1.2577,"Thames Valley"], "gloucester":["Gloucester",51.8642,-2.2382,"South West"],
  "edinburgh":["Edinburgh",55.9533,-3.1883,"Scotland"], "glasgow":["Glasgow",55.8642,-4.2518,"Scotland"]
};

var CACHE = {}, BUSY = {}, MISS = {}, timer = null, pushTimer = null, isTyping = false, lastSnapshot = "";
try { CACHE = JSON.parse(localStorage.getItem("uk_geo_v11") || "{}"); } catch (e) {}

function pt(lat, lon) { return { x: 448 + lon * 66, y: 708 - (lat - 51.5) * 96 }; }
function miles(a, b) {
  var dLat = (b.lat - a.lat) * 0.0174533, dLon = (b.lon - a.lon) * 0.0174533;
  var s1 = Math.sin(dLat / 2), s2 = Math.sin(dLon / 2);
  var h = s1 * s1 + Math.cos(a.lat * 0.0174533) * Math.cos(b.lat * 0.0174533) * s2 * s2;
  return Math.round(3958.8 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h)) * 1.22);
}
function isNum(s) {
  if (!s) return false;
  for (var i = 0; i < s.length; i++) if (s.charCodeAt(i) < 48 || s.charCodeAt(i) > 57) return false;
  return true;
}
function words(str) {
  var out = "", res = [];
  for (var i = 0; i < str.length; i++) {
    var c = str.charCodeAt(i);
    out += ((c >= 97 && c <= 122) || (c >= 65 && c <= 90) || (c >= 48 && c <= 57) || str.charAt(i) === ":") ? str.charAt(i).toLowerCase() : " ";
  }
  var p = out.split(" ");
  for (var j = 0; j < p.length; j++) if (p[j]) res.push(p[j]);
  return res;
}

function nowStamp() {
  var d = new Date(), hh = ("0" + d.getHours()).slice(-2), mm = ("0" + d.getMinutes()).slice(-2), ss = ("0" + d.getSeconds()).slice(-2);
  return hh + ":" + mm + ":" + ss;
}

function setSyncState(text, cls, info) {
  var st = document.getElementById("status");
  if (st) { st.textContent = text; st.className = "pill" + (cls ? " " + cls : ""); }
  if (info) document.getElementById("sync-info").textContent = info;
  document.getElementById("last-time").textContent = nowStamp();
}

function onUserEdit() {
  isTyping = true;
  run();
  clearTimeout(pushTimer);
  pushTimer = setTimeout(function() {
    isTyping = false;
    pushToCloud();
  }, 600);
}

function pushToCloud() {
  if (!DB_URL || DB_URL.indexOf("http") !== 0) {
    setSyncState("LOCAL ONLY", "busy", "Add Firebase URL to enable 10-crew sync");
    return;
  }
  setSyncState("SAVING...", "busy", "Sending update to crew...");
  var aVal = document.getElementById("avail").value;
  var lVal = document.getElementById("loads").value;
  lastSnapshot = aVal + "|||" + lVal;

  fetch(DB_URL + "/board.json", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ avail: aVal, loads: lVal, updated: Date.now() })
  }).then(function(r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    setSyncState("CREW LIVE", "", "Saved & shared with crew");
  }).catch(function(e) {
    setSyncState("SYNC ERR", "err", "Check Firebase Rules (" + e.message + ")");
  });
}

function pullFromCloud() {
  if (!DB_URL || DB_URL.indexOf("http") !== 0 || isTyping) return;
  fetch(DB_URL + "/board.json?t=" + Date.now())
    .then(function(r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function(data) {
      if (!data) {
        setSyncState("CREW LIVE", "", "Connected (board empty)");
        return;
      }
      var remoteA = data.avail || "";
      var remoteL = data.loads || "";
      var snap = remoteA + "|||" + remoteL;
      if (snap !== lastSnapshot) {
        lastSnapshot = snap;
        document.getElementById("avail").value = remoteA;
        document.getElementById("loads").value = remoteL;
        run();
        setSyncState("CREW LIVE", "", "Updated from crew at " + nowStamp());
      } else {
        setSyncState("CREW LIVE", "", "Live crew sync active");
      }
    })
    .catch(function(e) {
      setSyncState("SYNC ERR", "err", "Connection error (" + e.message + ")");
    });
}

function lookup(q) {
  if (!q || BUSY[q] || MISS[q] || CACHE[q]) return;
  BUSY[q] = true;
  var w = words(q);
  var isPc = (w.length === 2 && w[0].length >= 2 && w[0].length <= 4 && w[1].length === 3 && isNum(w[1].charAt(0)));
  var isOut = (w.length === 1 && w[0].length >= 2 && w[0].length <= 4 && !isNum(w[0].charAt(0)) && isNum(w[0].charAt(w[0].length - 1)));
  var url = isPc ? ("https://api.postcodes.io/postcodes/" + encodeURIComponent(w[0] + w[1]))
          : isOut ? ("https://api.postcodes.io/outcodes/" + encodeURIComponent(w[0]))
          : ("https://nominatim.openstreetmap.org/search?format=json&countrycodes=gb&limit=1&q=" + encodeURIComponent(q + ", UK"));

  fetch(url).then(function(r) { return r.json(); }).then(function(d) {
    delete BUSY[q];
    if ((isPc || isOut) && d && d.status === 200 && d.result) {
      CACHE[q] = [d.result.postcode || d.result.outcode, d.result.latitude, d.result.longitude, d.result.region || "UK Postcode"];
    } else if (!isPc && !isOut && d && d.length > 0) {
      CACHE[q] = [d[0].display_name.split(",")[0], parseFloat(d[0].lat), parseFloat(d[0].lon), "UK Location"];
    } else {
      MISS[q] = true;
    }
    try { localStorage.setItem("uk_geo_v11", JSON.stringify(CACHE)); } catch (e) {}
    run();
  }).catch(function() { delete BUSY[q]; MISS[q] = true; run(); });
}

function parse(text, missList, pendList) {
  var lf = String.fromCharCode(10), cr = String.fromCharCode(13);
  var lines = text.split(cr).join(lf).split(lf), out = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var tok = words(line), pad = " " + tok.join(" ") + " ";
    var times = [], night = pad.indexOf(" night ") !== -1, haz = pad.indexOf(" haz ") !== -1 || pad.indexOf(" adr ") !== -1;
    var cnt = 1, rem = [];
    for (var t = 0; t < tok.length; t++) {
      var w = tok[t], used = false;
      if (w.charAt(w.length - 1) === "x" && isNum(w.slice(0, -1))) { cnt = parseInt(w.slice(0, -1), 10); used = true; }
      else if (w.charAt(0) === "x" && isNum(w.slice(1))) { cnt = parseInt(w.slice(1), 10); used = true; }
      else if (w === "x" && t > 0 && isNum(tok[t - 1])) { cnt = parseInt(tok[t - 1], 10); used = true; }
      else if (w === "x" && t + 1 < tok.length && isNum(tok[t + 1])) { cnt = parseInt(tok[t + 1], 10); used = true; }
      else if (isNum(w) && ((t + 1 < tok.length && tok[t + 1] === "x") || (t > 0 && tok[t - 1] === "x"))) { used = true; }
      else if (w.indexOf(":") !== -1 && w.length >= 4) { times.push(w); used = true; }
      else if (isNum(w) && w.length === 4) { times.push(w.slice(0, 2) + ":" + w.slice(2)); used = true; }
      else if (w === "haz" || w === "adr" || w === "night" || w === "drivers" || w === "in" || w === "load") { used = true; }
      if (!used) rem.push(w);
    }
    if (cnt === 1 && times.length > 1) cnt = times.length;
    var found = null;
    for (var k in HUBS) {
      if (pad.indexOf(" " + k + " ") !== -1 || pad.indexOf(" " + k + "s ") !== -1) { found = HUBS[k]; break; }
    }
    var q = rem.join(" ").trim();
    if (!found && q && CACHE[q]) found = CACHE[q];
    if (found) {
      out.push({ name: found[0], lat: found[1], lon: found[2], reg: found[3], cnt: cnt, times: times, night: night, haz: haz });
    } else if (q.length >= 2 && !isNum(q)) {
      if (MISS[q]) missList.push(line); else pendList.push(q);
    }
  }
  return out;
}

function merge(arr) {
  var m = {}, res = [];
  for (var i = 0; i < arr.length; i++) {
    var x = arr[i];
    if (!m[x.name]) { m[x.name] = { name: x.name, lat: x.lat, lon: x.lon, reg: x.reg, cnt: x.cnt, times: x.times.slice(), night: x.night, haz: x.haz }; }
    else {
      m[x.name].cnt += x.cnt;
      if (x.night) m[x.name].night = true;
      if (x.haz) m[x.name].haz = true;
      for (var t = 0; t < x.times.length; t++) if (m[x.name].times.indexOf(x.times[t]) === -1) m[x.name].times.push(x.times[t]);
    }
  }
  for (var k in m) res.push(m[k]);
  return res;
}

function run() {
  var miss = [], pend = [];
  var hubs = merge(parse(document.getElementById("avail").value, miss, pend));
  hubs.sort(function(a, b) { return b.cnt - a.cnt; });

  var lf = String.fromCharCode(10), cr = String.fromCharCode(13);
  var rawL = document.getElementById("loads").value.split(cr).join(lf).split(",").join(lf).split(lf);
  var lArr = [];
  for (var i = 0; i < rawL.length; i++) if (rawL[i].trim()) lArr = lArr.concat(parse(rawL[i], miss, pend));
  var loads = merge(lArr);

  var pins = document.getElementById("pins"), lines = document.getElementById("lines");
  var hList = document.getElementById("list-hubs"), lList = document.getElementById("list-loads");
  var ns = "http://www.w3.org/2000/svg";
  pins.innerHTML = ""; lines.innerHTML = ""; hList.innerHTML = ""; lList.innerHTML = "";

  var uTot = 0, lTot = 0;
  for (var a = 0; a < hubs.length; a++) uTot += hubs[a].cnt;
  for (var b = 0; b < loads.length; b++) lTot += loads[b].cnt;
  document.getElementById("s-units").textContent = uTot;
  document.getElementById("s-hubs").textContent = hubs.length;
  document.getElementById("s-loads").textContent = lTot;

  for (var h = 0; h < hubs.length; h++) {
    var hub = hubs[h], p = pt(hub.lat, hub.lon), r = Math.min(22, 10 + hub.cnt * 2.2);
    var col = hub.night ? "#a855f7" : (hub.times.length ? "#f59e0b" : "#38bdf8");
    var c = document.createElementNS(ns, "circle");
    c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); c.setAttribute("r", r); c.setAttribute("fill", col); c.setAttribute("stroke", "#0f172a"); c.setAttribute("stroke-width", "2");
    pins.appendChild(c);

    var tx = document.createElementNS(ns, "text");
    tx.setAttribute("x", p.x); tx.setAttribute("y", p.y); tx.setAttribute("class", "cnt"); tx.textContent = hub.cnt;
    pins.appendChild(tx);

    var lb = document.createElementNS(ns, "text");
    lb.setAttribute("x", p.x + r + 5); lb.setAttribute("y", p.y + 4); lb.setAttribute("class", "lbl");
    lb.textContent = hub.name + (hub.times.length ? " (" + hub.times.join(", ") + ")" : (hub.night ? " (Night)" : ""));
    pins.appendChild(lb);

    var card = document.createElement("div");
    card.className = "card";
    var cls = hub.night ? "tag n" : (hub.times.length ? "tag t" : "tag");
    card.innerHTML = '<div><div class="card-title">' + hub.name + '</div><div class="card-sub">' + (hub.times.length ? "Waves: " + hub.times.join(", ") : hub.reg) + '</div></div><span class="' + cls + '">' + hub.cnt + 'x</span>';
    hList.appendChild(card);
  }

  document.getElementById("hdr-loads").style.display = loads.length ? "block" : "none";
  for (var l = 0; l < loads.length; l++) {
    var ld = loads[l], lp = pt(ld.lat, ld.lon), col = ld.haz ? "#ef4444" : "#10b981";
    var near = [];
    for (var k = 0; k < hubs.length; k++) near.push({ name: hubs[k].name, lat: hubs[k].lat, lon: hubs[k].lon, mi: miles(ld, hubs[k]) });
    near.sort(function(x, y) { return x.mi - y.mi; });
    near = near.slice(0, 3);

    for (var m = 0; m < near.length; m++) {
      var hp = pt(near[m].lat, near[m].lon), ln = document.createElementNS(ns, "line");
      ln.setAttribute("x1", lp.x); ln.setAttribute("y1", lp.y); ln.setAttribute("x2", hp.x); ln.setAttribute("y2", hp.y);
      ln.setAttribute("stroke", col); ln.setAttribute("stroke-width", m === 0 ? "2.4" : "1.2"); ln.setAttribute("stroke-dasharray", "5 4"); ln.setAttribute("opacity", m === 0 ? "0.9" : "0.45");
      lines.appendChild(ln);
    }

    var sz = ld.haz ? 15 : 13, poly = document.createElementNS(ns, "polygon");
    poly.setAttribute("points", lp.x + "," + (lp.y - sz) + " " + (lp.x + sz) + "," + lp.y + " " + lp.x + "," + (lp.y + sz) + " " + (lp.x - sz) + "," + lp.y);
    poly.setAttribute("fill", col); poly.setAttribute("stroke", ld.haz ? "#fbbf24" : "#fff"); poly.setAttribute("stroke-width", "2");
    pins.appendChild(poly);

    var ltx = document.createElementNS(ns, "text");
    ltx.setAttribute("x", lp.x); ltx.setAttribute("y", lp.y); ltx.setAttribute("class", "cnt");
    if (ld.haz) ltx.setAttribute("fill", "#fff");
    ltx.textContent = ld.cnt;
    pins.appendChild(ltx);

    var llb = document.createElementNS(ns, "text");
    llb.setAttribute("x", lp.x + 18); llb.setAttribute("y", lp.y + 4); llb.setAttribute("class", ld.haz ? "lbl h" : "lbl g");
    llb.textContent = (ld.haz ? "HAZ: " : "LOAD: ") + ld.name;
    pins.appendChild(llb);

    var lcard = document.createElement("div");
    lcard.className = ld.haz ? "card ld hz" : "card ld";
    var mTxt = near.length ? "Nearest: " + near.map(function(n) { return n.name + " (~" + n.mi + "m)"; }).join(" | ") : "No fleet available";
    lcard.innerHTML = '<div><div class="card-title" style="color:' + (ld.haz ? "#fca5a5" : "#6ee7b7") + ';">' + ld.name + (ld.haz ? '<span class="tag h">&#9763; HAZ</span>' : '') + '</div><div class="card-sub" style="color:#cbd5e1;">' + mTxt + '</div></div><span class="tag g">' + ld.cnt + 'x</span>';
    lList.appendChild(lcard);
  }

  var msg = document.getElementById("msg");
  if (miss.length) { msg.style.display = "block"; msg.textContent = "Not found: " + miss.join(", "); }
  else if (pend.length) { msg.style.display = "block"; msg.textContent = "Locating: " + pend.join(", ") + "..."; }
  else { msg.style.display = "none"; }

  if (pend.length) {
    clearTimeout(timer);
    timer = setTimeout(function() { for (var p = 0; p < pend.length; p++) lookup(pend[p]); }, 500);
  }
}

run();
pullFromCloud();
setInterval(pullFromCloud, 2500);
</script>
</body>
</html>
